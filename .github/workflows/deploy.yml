name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate static site
        run: |
          set -euo pipefail

          test -f index.html
          test -f assets/css/styles.css
          test -f assets/js/main.js
          test -f assets/img/favicon.svg
          test -f assets/img/apple-touch-icon.png

          if grep -RInE '(src|href)="/(assets|index\.html|#|")' --include='*.html' .; then
            echo "Root-relative local paths break GitHub Pages project-site subpaths." >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
